<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixPick 기획안 프리젠테이션</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            safelist: [
                'border-t-teal-500', 'bg-teal-500/10', 'border-t-cyan-500', 'bg-cyan-500/10',
                'border-t-emerald-500', 'bg-emerald-500/10', 'border-t-blue-500', 'bg-blue-500/10',
                'border-t-purple-500', 'bg-purple-500/10', 'border-t-red-500', 'bg-red-500/10',
                'border-t-yellow-500', 'bg-yellow-500/10', 'border-t-pink-500', 'bg-pink-500/10',
                'border-t-indigo-500', 'bg-indigo-500/10', 'border-t-orange-500', 'bg-orange-500/10'
            ],
            theme: {
                extend: {
                    colors: {
                        dark: '#050814'
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Jua&display=swap');

        body {
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background-color: #000;
            color: #f1f5f9;
            overflow: hidden;
            margin: 0;
            padding: 0;
            word-break: keep-all; 
        }

        :root {
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        /* Slide Viewer Styles */
        #viewer-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            position: relative;
        }

        .slide-wrapper {
            width: 1280px; 
            height: 720px;
            background: radial-gradient(circle at 50% 0%, #064E3B 0%, #050814 80%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: none; 
            flex-direction: column;
        }

        .slide-wrapper.active {
            display: flex;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Custom Scrollbar for overflow areas */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(16, 185, 129, 0.8);
        }

        /* Tooltip System for Easy Terms */
        .t-tip {
            position: relative;
            display: inline-block;
            border-bottom: 2px dashed #38BDF8;
            color: #38BDF8;
            cursor: help;
            font-weight: 700;
        }
        .t-tip .t-content {
            visibility: hidden;
            opacity: 0;
            width: 300px;
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: #f1f5f9;
            text-align: left;
            border-radius: 12px;
            padding: 14px;
            position: absolute;
            z-index: 99999 !important;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.8);
            border: 1px solid rgba(56, 189, 248, 0.5);
            font-size: 15px;
            font-weight: 400;
            line-height: 1.5;
            transition: all 0.2s ease-in-out;
            word-break: keep-all;
        }
        .t-tip:hover .t-content {
            visibility: visible;
            opacity: 1;
            bottom: 140%;
        }
        .t-tip .t-content::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: rgba(56, 189, 248, 0.5) transparent transparent transparent;
        }

        /* UI Controls */
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background: rgba(0,0,0,0.7);
            padding: 12px 24px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            z-index: 10000;
            align-items: center;
        }

        .btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
        }

        .btn:hover { background: #10B981; border-color: #10B981; }

        /* Glass Cards */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(12px);
        }

        @keyframes dash { to { stroke-dashoffset: -20; } }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body>

    <div id="viewer-container"></div>

    <div id="controls">
        <button class="btn" onclick="prevSlide()"><i data-lucide="chevron-left" class="w-5 h-5"></i> 이전</button>
        <span id="page-indicator" class="text-white font-mono text-base tracking-widest w-24 text-center">1 / 20</span>
        <button class="btn" onclick="nextSlide()">다음 <i data-lucide="chevron-right" class="w-5 h-5"></i></button>
    </div>

    <script>
        const slides = [];

        // Tooltip Helper Function (초등학생 눈높이 용어 사전)
        const tTip = (term, exp) => `<span class="t-tip">${term}<span class="t-content"><strong class="text-teal-300 block mb-2 text-base border-b border-teal-500/30 pb-2">💡 쉽게 말하면?</strong>${exp}</span></span>`;

        // Slide Templates
        const tCover = (title, sub, epilog) => `
            <div class="flex-1 flex flex-col items-center justify-center text-center p-20 relative">
                <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-10 pointer-events-none"></div>
                <div class="flex flex-col items-center mb-8 z-10">
                    <div class="w-24 h-24 bg-emerald-500 rounded-3xl flex items-center justify-center shadow-[0_0_40px_rgba(16,185,129,0.5)] mb-6 transform rotate-3">
                        <i data-lucide="layers" class="text-white w-12 h-12"></i>
                    </div>
                    <div class="text-white font-extrabold text-2xl tracking-widest">Z2H TEAM</div>
                </div>
                <h1 class="text-8xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-500 mb-6 leading-tight z-10 drop-shadow-lg">${title}</h1>
                <h2 class="text-3xl text-white font-bold tracking-wide mb-6 z-10">${sub}</h2>
                <div class="text-gray-400 tracking-widest text-lg z-10 leading-relaxed">${epilog}</div>
            </div>
        `;

        const tContent = (stage, title, sub, html) => `
            <div class="h-full flex flex-col p-10 relative">
                <div class="flex justify-between items-end border-b border-white/10 pb-4 mb-4 z-10 shrink-0">
                    <div>
                        <div class="text-emerald-400 font-bold text-lg tracking-widest mb-1.5">${stage}</div>
                        <h2 class="text-4xl font-bold text-white">${title}</h2>
                    </div>
                    <div class="text-gray-400 text-lg font-medium">${sub}</div>
                </div>
                <div class="flex-1 overflow-y-auto custom-scrollbar flex flex-col relative z-10 pr-2 pb-2 text-lg">
                    ${html}
                </div>
                <div class="mt-auto pt-3 flex justify-between text-sm text-gray-600 font-mono z-50 font-bold shrink-0">
                    <span>FixPick · Z2H (Zero to Hundred)</span>
                    <span>Image & Document Automation SaaS</span>
                </div>
            </div>
        `;

        const card = (color, title, desc, extra='') => `
            <div class="glass-card flex-1 border-t-[5px] border-t-${color}-500 flex flex-col relative overflow-hidden transition-transform duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-${color}-500/20">
                <div class="absolute top-0 right-0 w-32 h-32 bg-${color}-500/10 rounded-full filter blur-[40px] -mr-10 -mt-10 pointer-events-none"></div>
                <h3 class="text-xl font-bold text-white mb-2 flex items-center gap-2 relative z-10">${title}</h3>
                <p class="text-base text-gray-300 leading-relaxed flex-1 relative z-10">${desc}</p>
                ${extra}
            </div>
        `;

        // ==========================================
        // 슬라이드 구성
        // ==========================================

        slides.push({ html: tCover("FixPick", "이미지·문서 자동화 플랫폼 — 이제 3초면 끝", "서비스 기획안 소개 및 데모 · v3.0<br>팀 Z2H (Zero to Hundred) · 2026.07") });

        slides.push({ html: tContent("CONTENTS", "목차", "Table of Contents", `
            <div class="grid grid-cols-2 gap-8 my-auto px-4 py-2">
                <div class="space-y-6">
                    <div class="group">
                        <h3 class="text-2xl text-white font-bold mb-1.5 flex items-center"><span class="text-teal-500 mr-4 font-mono text-xl opacity-80">01</span>서비스 개요 & 포지셔닝</h3>
                        <p class="text-gray-400 pl-12 text-base">단일 툴을 넘어선 통합 자동화 서비스 요약</p>
                    </div>
                    <div class="group">
                        <h3 class="text-2xl text-white font-bold mb-1.5 flex items-center"><span class="text-teal-500 mr-4 font-mono text-xl opacity-80">02</span>문제 정의 & 시장 기회</h3>
                        <p class="text-gray-400 pl-12 text-base leading-relaxed">4대 문제점 및 ${tTip('TAM·SAM·SOM', '전체 시장, 타겟 시장, 수익 창출 시장')} 프레임워크</p>
                    </div>
                    <div class="group">
                        <h3 class="text-2xl text-white font-bold mb-1.5 flex items-center"><span class="text-teal-500 mr-4 font-mono text-xl opacity-80">03</span>경쟁 분석 & 차별화</h3>
                        <p class="text-gray-400 pl-12 text-base">경쟁 매트릭스 및 4대 차별화 강점</p>
                    </div>
                    <div class="group">
                        <h3 class="text-2xl text-white font-bold mb-1.5 flex items-center"><span class="text-teal-500 mr-4 font-mono text-xl opacity-80">04</span>비즈니스 모델 & KPI</h3>
                        <p class="text-gray-400 pl-12 text-base leading-relaxed">수익 모델 3단계 및 주요 지표 설정</p>
                    </div>
                </div>
                <div class="space-y-6">
                    <div class="group">
                        <h3 class="text-2xl text-white font-bold mb-1.5 flex items-center"><span class="text-teal-500 mr-4 font-mono text-xl opacity-80">05</span>핵심 기능 소개</h3>
                        <p class="text-gray-400 pl-12 text-base">기능별 화면 데모 시연</p>
                    </div>
                    <div class="group">
                        <h3 class="text-2xl text-white font-bold mb-1.5 flex items-center"><span class="text-teal-500 mr-4 font-mono text-xl opacity-80">06</span>실행 로드맵 & 조직</h3>
                        <p class="text-gray-400 pl-12 text-base">주차별 개발 일정 및 실행 조직</p>
                    </div>
                    <div class="group">
                        <h3 class="text-2xl text-white font-bold mb-1.5 flex items-center"><span class="text-teal-500 mr-4 font-mono text-xl opacity-80">07</span>리스크 & 팀 소개</h3>
                        <p class="text-gray-400 pl-12 text-base">법적/기술적 리스크 대비 및 팀 소개</p>
                    </div>
                </div>
            </div>
        `) });

        slides.push({ html: tContent("01 · 서비스 개요", "단일 툴을 넘어선 '통합 자동화'", "Core Strategy & Summary", `
            <div class="w-full my-auto flex flex-col gap-5 py-2">
                <div class="w-full max-w-4xl glass-card relative overflow-hidden border-teal-500/30 mx-auto text-center p-6 shadow-2xl shrink-0">
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-teal-400 to-emerald-500"></div>
                    <h3 class="text-xl font-bold text-gray-300 mb-2 opacity-80">‘단일 이미지 툴’이 아니라</h3>
                    <p class="text-emerald-400 text-3xl font-extrabold mb-3 leading-tight">대량 파일 일괄 처리 + 팀 규격(${tTip('프리셋', '팀원과 공유하는 디자인 사전 설정 규칙')}) 공유</p>
                    <p class="text-gray-200 text-lg font-medium">마케터와 실무자를 위한 <strong>압도적 '업무 효율'</strong> 플랫폼.</p>
                </div>
                
                <div class="grid grid-cols-4 gap-4 w-full shrink-0">
                    ${card('teal', '🆓 무료 코어', `단순 변환은 <strong class="text-white">전면 무료</strong>로 ${tTip('초기 트래픽', '방문자 수')} 극대화.`)}
                    ${card('yellow', '⚡ 유료 크레딧', `${tTip('GPU 연산', '고성능 컴퓨터 연산')}이 필요한 고도화 AI 기능만 합리적 과금.`)}
                    ${card('blue', '📈 한계비용 0', `무료 기능은 전면 ${tTip('브라우저 처리', '서버비 0원 사용자 기기 연산')}로 유지비 절감.`)}
                    ${card('emerald', '🔒 강력한 보안', `서버에 원본을 남기지 않는 안전한 ${tTip('Web-first', '웹 브라우저 직접 구동')} 구조.`)}
                </div>
            </div>
        `) });

        slides.push({ html: tContent("02 · 문제 정의 및 시장 기회", "누적된 3시간의 낭비를 해결하다", "Problem & Market Size", `
            <div class="w-full my-auto flex gap-6 items-stretch relative py-2">
                <div class="w-[48%] flex flex-col justify-center z-10 shrink-0">
                    <h3 class="text-2xl font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="alert-triangle" class="text-red-400 w-6 h-6"></i> 우리가 푸는 4대 핵심 문제</h3>
                    <div class="grid grid-cols-2 gap-3.5 flex-1">
                        ${card('cyan', '📐 반복 리사이징', '채널별 규격에 맞추어 매번 이미지를 수작업으로 재생성.')}
                        ${card('red', '📍 위치정보 방치', `사진 속 ${tTip("EXIF", "위치 및 기기 정보")} 일괄 삭제 툴 부재로 보안 노출.`)}
                        ${card('emerald', '🖼️ 여백(패딩) 수작업', '보고서용 이미지 비율 유지를 위한 반복적인 여백 추가.')}
                        ${card('purple', '🗂️ 파일명 미정리', '수십 장의 파일명을 사내 규격에 맞게 수동 변경하는 비효율.')}
                    </div>
                </div>
                
                <div class="w-[52%] bg-black/40 border border-white/10 rounded-3xl p-6 shadow-inner flex flex-col justify-center relative shrink-0">
                    <h3 class="text-2xl font-bold text-white mb-5 flex items-center gap-2"><i data-lucide="pie-chart" class="text-blue-400 w-6 h-6"></i> 시장 규모 프레임워크</h3>
                    <div class="space-y-4">
                        <div class="flex items-center gap-4 group">
                            <div class="w-14 h-14 bg-blue-900/50 rounded-full flex flex-col items-center justify-center border-2 border-blue-500/50 flex-shrink-0"><span class="text-blue-400 font-bold text-sm">TAM</span></div>
                            <div>
                                <div class="text-white font-bold text-base mb-0.5">${tTip("전체 시장 (Total Market)", "이론적 최대 도달 시장")}</div>
                                <div class="text-xs text-gray-400">산정: 통계청 사업체 수 × 사무·마케팅 직군</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 group">
                            <div class="w-14 h-14 bg-emerald-900/50 rounded-full flex flex-col items-center justify-center border-2 border-emerald-500/50 flex-shrink-0"><span class="text-emerald-400 font-bold text-sm">SAM</span></div>
                            <div>
                                <div class="text-white font-bold text-base mb-0.5">${tTip("유효 시장 (Serviceable Market)", "실질적 타겟팅 가능 시장")}</div>
                                <div class="text-xs text-gray-400">산정: 이커머스 셀러 및 마케팅 실무자 추정</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 group">
                            <div class="w-14 h-14 bg-yellow-900/50 rounded-full flex flex-col items-center justify-center border-2 border-yellow-500/50 flex-shrink-0"><span class="text-yellow-400 font-bold text-sm">SOM</span></div>
                            <div>
                                <div class="text-white font-bold text-base mb-0.5">${tTip("수익 시장 (Obtainable Market)", "당장 매출을 확보할 핵심 시장")}</div>
                                <div class="text-xs text-gray-400">산정: 초기 채널 도달 수 × 예상 활성 전환율</div>
                            </div>
                        </div>
                    </div>
                    <a href="https://kosis.kr/" target="_blank" class="absolute bottom-3 right-5 text-xs text-gray-500 hover:text-gray-400 flex items-center gap-1"><i data-lucide="external-link" class="w-3.5 h-3.5"></i> 출처: 통계청(KOSIS)</a>
                </div>
            </div>
        `) });

        slides.push({ html: tContent("03 · 경쟁 분석 및 차별화", "기존 툴과의 압도적 격차", "Competitive Edge", `
            <div class="w-full my-auto flex flex-col gap-4 py-2">
                <p class="text-gray-300 text-lg font-light text-center mb-1 shrink-0">단발성 웹툴과 무거운 디자인 툴 사이, <strong class="text-emerald-400 font-bold text-xl">FixPick만의 확실한 포지셔닝</strong></p>
                
                <div class="grid grid-cols-4 gap-3.5 shrink-0">
                    <div class="bg-gray-900/50 border border-gray-600 rounded-2xl p-4 flex flex-col relative opacity-80">
                        <div class="text-gray-400 text-xs font-bold mb-1.5 border-b border-gray-700 pb-1.5">단발 무료 웹툴</div>
                        <div class="text-xs text-gray-300 mb-1"><span class="text-green-400 mr-1 font-bold">강점:</span>무설치 즉시 사용</div>
                        <div class="text-xs text-red-400"><span class="mr-1 font-bold">약점:</span>대량 배치 및 협업 불가</div>
                    </div>
                    <div class="bg-gray-900/50 border border-gray-600 rounded-2xl p-4 flex flex-col relative opacity-80">
                        <div class="text-gray-400 text-xs font-bold mb-1.5 border-b border-gray-700 pb-1.5">종합 디자인 툴</div>
                        <div class="text-xs text-gray-300 mb-1"><span class="text-green-400 mr-1 font-bold">강점:</span>고급 편집 자유도</div>
                        <div class="text-xs text-red-400"><span class="mr-1 font-bold">약점:</span>반복 실무엔 오버스펙</div>
                    </div>
                    <div class="bg-gray-900/50 border border-gray-600 rounded-2xl p-4 flex flex-col relative opacity-80">
                        <div class="text-gray-400 text-xs font-bold mb-1.5 border-b border-gray-700 pb-1.5">오프라인 유틸</div>
                        <div class="text-xs text-gray-300 mb-1"><span class="text-green-400 mr-1 font-bold">강점:</span>대량 처리 가능</div>
                        <div class="text-xs text-red-400"><span class="mr-1 font-bold">약점:</span>설치 필수, 클라우드 부재</div>
                    </div>

            </div>
        ` });

        // --- Render Engine ---
        const container = document.getElementById('viewer-container');
        const indicator = document.getElementById('page-indicator');
        let currentSlide = 0;

        slides.forEach((slide, index) => {
            const div = document.createElement('div');
            div.className = `slide-wrapper ${index === 0 ? 'active' : ''}`;
            div.innerHTML = slide.html;
            container.appendChild(div);
        });

        // Initialize Lucide Icons Safely
        function renderIcons() {
            try {
                if (typeof lucide !== 'undefined' && lucide.createIcons) {
                    lucide.createIcons();
                }
            } catch (err) {
                console.warn('Error rendering icons:', err);
            }
        }
        
        renderIcons();

        const slideElements = document.querySelectorAll('.slide-wrapper');

        function showSlide(index) {
            slideElements.forEach(el => el.classList.remove('active'));
            slideElements[index].classList.add('active');
            indicator.textContent = `${index + 1} / ${slides.length}`;
            renderIcons();
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                showSlide(currentSlide);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                showSlide(currentSlide);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                nextSlide();
            }
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevSlide();
            }
        });

    </script>
